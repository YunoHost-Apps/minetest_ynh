#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "minetest"
name = "Luanti"
description.en = "Voxel game engine and game. Need a client to connect to the server"
description.fr = "Moteur de jeu de type « bac à sable ». Nécessite un client pour se connecter au serveur"

version = "5.17.0~ynh3"

maintainers = []

[upstream]
license = "MIT"
website = "https://www.luanti.org/"
code = "https://github.com/luanti-org/luanti"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "2000M"
ram.runtime = "50M"

[install]
[install.domain]
type = "domain"

[install.game]
ask.en = "Choose a game for your server"
ask.fr = "Choissisez un jeu pour votre serveur"
type = "select"
choices = ["minetest_game", "capturetheflag", "mineclonia", "mineclone2"]
default = "minetest_game"

[install.servername]
ask.en = "Choose a name for your server"
ask.fr = "Choissisez un nom pour votre serveur"
type = "string"
default = "Luanti server"

[install.pvp]
ask.en = "Whether to enable players killing each other"
ask.fr = "Permettre aux joueurs de s'entre-tuer"
type = "boolean"
default = false

[install.creative]
ask.en = "Whether to enable creative mode (unlimited inventory)"
ask.fr = "Permettre l'utilisation du mode créatif (inventaire illimité)"
type = "boolean"
default = false

[install.damage]
ask.en = "Enable players getting damage and dying"
ask.fr = "Permettre aux joueurs de subir des dégâts et de mourir"
type = "boolean"
default = true

[resources]
[resources.sources]

[resources.sources.main]
url = "https://github.com/luanti-org/luanti/archive/refs/tags/5.17.0.tar.gz"
sha256 = "52e7dd315ae0e5c3868a23231e691578cd694bcca5af627fc57c03f32bdc846f"
autoupdate.strategy = "latest_github_release"

[resources.sources.minetest_game]
url = "https://github.com/luanti-org/minetest_game/archive/refs/tags/5.8.0.tar.gz"
sha256 = "33a3bb43b08497a0bdb2f49f140a2829e582d5c16c0ad52be1595c803f706912"
autoupdate.upstream = "https://github.com/luanti-org/minetest_game"
autoupdate.strategy = "latest_github_tag"

[resources.sources.capturetheflag]
url = "https://github.com/MT-CTF/capturetheflag/archive/refs/tags/v3.12.tar.gz"
sha256 = "10b7d62e5dc43482843a4293028a4fa9bf0f93e0264e35bb7d7ebdeeb1e670af"
autoupdate.upstream = "https://github.com/MT-CTF/capturetheflag"
autoupdate.strategy = "latest_github_release"

[resources.sources.mineclonia]
url = "https://codeberg.org/mineclonia/mineclonia/archive/0.123.1.tar.gz"
sha256 = "0cc7f5a257b97fe6c7c687d6e1158342e285eb8b3ee1acd848e64a46fb8738d9"
autoupdate.upstream = "https://codeberg.org/mineclonia/mineclonia"
autoupdate.strategy = "latest_forgejo_release"

[resources.sources.mineclone2]
url = "https://github.com/VoxeLibre/VoxeLibre/archive/refs/tags/0.92.3.tar.gz"
sha256 = "3e76a4cca002307e59cd68bb97c7415117ea8393e20f87f27a75e236451f2ab0"
autoupdate.upstream = "https://github.com/VoxeLibre/VoxeLibre"
autoupdate.strategy = "latest_github_tag"

[resources.system_user]

[resources.install_dir]

[resources.data_dir]
subdirs = [".luanti", ".luanti/worlds"]

[resources.permissions]
main.allowed = "visitors"

[resources.ports]
main.default = 30000
main.exposed = "UDP"

[resources.apt]
packages = [
    "build-essential",
    "cmake",
    "libsqlite3-dev",
    "zlib1g-dev",
    "libgmp-dev",
    "libjsoncpp-dev",
    "libzstd-dev",
]

packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "libcurl4-dev, libluajit2-5.1-dev";
    elif [[ $YNH_DEBIAN_VERSION == "trixie" ]]; then
        echo "libcurl4t64, libluajit-5.1-dev";
    fi
    """


